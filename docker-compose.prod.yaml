services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fibenchi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-fibenchi}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-fibenchi}"]
      interval: 5s
      timeout: 5s
      retries: 5

  shioaji:
    image: sinotrade/shioaji-server:1.7.0
    entrypoint: ["shioaji"]
    command: ["server", "start", "--no-open"]
    restart: unless-stopped
    environment:
      SJ_API_KEY: ${SJ_API_KEY:-}
      SJ_SEC_KEY: ${SJ_SEC_KEY:-}
      SJ_PRODUCTION: ${SJ_PRODUCTION:-false}
      SJ_HTTP_ADDR: ${SJ_HTTP_ADDR:-0.0.0.0:8080}
    expose:
      - "8080"

  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-fibenchi}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-fibenchi}
      REFRESH_CRON: ${REFRESH_CRON:-0 23 * * *}
      SHIOAJI_BASE_URL: ${SHIOAJI_BASE_URL:-http://shioaji:8080}
      SHIOAJI_TIMEOUT_SECONDS: ${SHIOAJI_TIMEOUT_SECONDS:-5}
      SHIOAJI_MAX_SUBSCRIPTIONS: ${SHIOAJI_MAX_SUBSCRIPTIONS:-180}
    ports:
      - "18000:8000"
    depends_on:
      db:
        condition: service_healthy
      shioaji:
        condition: service_started

volumes:
  pgdata:
