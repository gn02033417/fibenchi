services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fibenchi
      POSTGRES_PASSWORD: fibenchi
      POSTGRES_DB: fibenchi
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fibenchi"]
      interval: 5s
      timeout: 5s
      retries: 5

  shioaji:
    image: sinotrade/shioaji:1.7.0
    entrypoint: ["shioaji"]
    command: ["server", "start", "--no-open"]
    environment:
      SJ_API_KEY: ${SJ_API_KEY:-}
      SJ_SEC_KEY: ${SJ_SEC_KEY:-}
      SJ_PRODUCTION: ${SJ_PRODUCTION:-false}
    expose:
      - "8080"

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://fibenchi:fibenchi@db:5432/fibenchi
      REFRESH_CRON: ${REFRESH_CRON:-0 23 * * *}
      SHIOAJI_BASE_URL: ${SHIOAJI_BASE_URL:-http://shioaji:8080}
      SHIOAJI_TIMEOUT_SECONDS: ${SHIOAJI_TIMEOUT_SECONDS:-5}
    ports:
      - "18000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      shioaji:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      target: dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  pgdata:
  frontend_node_modules:
