name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  test-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fibenchi
          POSTGRES_PASSWORD: fibenchi
          POSTGRES_DB: fibenchi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fibenchi -d fibenchi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/requirements*.txt

      - run: uv pip install --system -r requirements-dev.txt
      - run: ruff check .

      - name: Verify Taiwan credential boundary
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path("..").resolve()
          forbidden = ("SJ_API_KEY", "SJ_SEC_KEY")
          frontend_source = root / "frontend" / "src"
          for path in frontend_source.rglob("*"):
              if path.is_file() and path.suffix in {".ts", ".tsx", ".js", ".jsx", ".html", ".css"}:
                  text = path.read_text(encoding="utf-8", errors="ignore")
                  assert not any(name in text for name in forbidden), path

          compose = (root / "docker-compose.prod.yaml").read_text(encoding="utf-8")
          sidecar = compose.split("\n  shioaji:\n", 1)[1].split("\n  app:\n", 1)[0]
          app = compose.split("\n  app:\n", 1)[1]
          assert all(name in sidecar for name in forbidden)
          assert not any(name in app for name in forbidden)
          print("Taiwan sidecar credentials stay on the shioaji service boundary")
          PY

      - name: Upgrade and verify clean PostgreSQL database
        env:
          DATABASE_URL: postgresql+asyncpg://fibenchi:fibenchi@127.0.0.1:5432/fibenchi
        run: |
          alembic upgrade head
          python - <<'PY'
          import asyncio

          from sqlalchemy import text
          from sqlalchemy.ext.asyncio import create_async_engine

          async def main():
              engine = create_async_engine("postgresql+asyncpg://fibenchi:fibenchi@127.0.0.1:5432/fibenchi")
              async with engine.connect() as connection:
                  version = (await connection.execute(text("SELECT version_num FROM alembic_version"))).scalar_one()
                  assert version == "0022", version
                  for table in ("assets", "symbol_directory"):
                      result = await connection.execute(
                          text(
                              "SELECT 1 FROM information_schema.columns "
                              "WHERE table_name = :table AND column_name = 'exchange'"
                          ),
                          {"table": table},
                      )
                      assert result.scalar_one_or_none() == 1, table
              await engine.dispose()

          asyncio.run(main())

      # The cross-language contract artifacts are generated from Python sources
      # (schemas/companion.py, compute/indicators.py) and consumed by the
      # separate companion app. Regenerate them here and fail if anything moves:
      # a dirty tree means someone edited a source without re-exporting, so the
      # artifact the app reads no longer describes this backend.
      - name: Contract artifacts are in sync with their sources
        run: |
          python -m scripts.export_companion_schema
          python -m scripts.export_indicator_contract
          # `:/` anchors the pathspec to the repo root. The exporters write to a
          # __file__-relative path, so the artifacts always land in backend/ —
          # but a plain cwd-relative spec silently matches nothing (and so
          # passes) from any cwd but backend/. This survives the step moving to
          # a job without the working-directory default above.
          if ! git diff --exit-code -- :/backend/companion.schema.json :/backend/indicator.contract.json :/backend/indicator.fixtures.json; then
            echo "::error::Contract artifacts are stale. Run both export scripts in backend/ and commit the result (then copy into fibenchi-app/)."
            exit 1
          fi

      - name: Taiwan offline integration gate
        run: pytest tests/integration/test_taiwan_e2e.py tests/integration/test_taiwan_migration_e2e.py -v

      - run: pytest
      - run: uv pip install --system pip-audit
      - run: pip-audit -r requirements.txt

  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run build

      - name: Verify public frontend bundle has no Shioaji credentials
        run: |
          if grep -R -n -E 'SJ_API_KEY|SJ_SEC_KEY' dist; then
            echo "::error::Shioaji credentials or credential names leaked into the frontend bundle"
            exit 1
          fi
      - run: pnpm run test
      - run: pnpm audit --prod || true

  build-image:
    needs: [test-backend, test-frontend]
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
